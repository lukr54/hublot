[package]
name = "host-agent"
description = "Hublot's host agent — streams the physical text console over QUIC"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

# Kept deliberately small. This runs on the hypervisor and every dependency here is attack surface
# (THREAT-MODEL.md §5). The console reader itself is plain libc.
[dependencies]
protocol = { path = "../protocol" }
pinning = { path = "../pinning" }
anyhow.workspace = true
tokio.workspace = true
rustls.workspace = true
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rcgen = "0.13"
libc = "0.2"
