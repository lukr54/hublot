# Workspace manifest for the Linux side.
#
# `Cargo.toml` describes the Windows half — the panel, the Windows agent, and the crates only those
# two use — and excludes anything that cannot compile there. The Linux crates need the mirror image
# of that, and cargo insists a workspace root be named `Cargo.toml`, so this is copied over it on
# the target box rather than selected with a flag:
#
#   tar czf - --exclude=./target --exclude=./.git crates Cargo*.toml | ssh box 'tar xzf - -C ~/hublot'
#   ssh box 'cd ~/hublot && cp Cargo-linux.toml Cargo.toml && cargo build --release -p host-agent'
#
# Keeping it in the repo is the point: the shared crates (`protocol` above all) are edited on
# Windows, and nothing there will tell you that a new `ClientMsg` variant just made `host-agent`'s
# match non-exhaustive. Building the Linux half is how you find out.
[workspace]
resolver = "2"
members = [
    "crates/pinning",
    "crates/protocol",
    "crates/host-agent",
    "crates/spike-console",
]
# Windows-only; built there, not here.
exclude = [
    "crates/winclip",
    "crates/agent-core",
    "crates/win-agent",
    "crates/pve",
    "crates/mirror",
    "crates/spike-term",
    "crates/spike-mirror",
    "crates/spike-screen",
    "panel/src-tauri",
]

[workspace.package]
edition = "2021"
version = "0.0.0"
license = "MIT"
publish = false

[profile.release]
opt-level = 3

[workspace.dependencies]
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-std", "io-util"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
